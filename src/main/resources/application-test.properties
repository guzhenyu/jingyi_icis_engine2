# PostgreSQL connection details come from PostgreSqlTestConfiguration.
# Unlike an embedded database, PostgreSQL needs an explicit schema creation policy.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
cert_test_mode=true
logging.file.path=target/test-logs/icis

# application module
jingyi.textresources.icis_config=classpath:/text_resources/icis_config.pb.txt
jingyi.textresources.common_text=classpath:/config/pbtxt/common_text.pb.txt
jingyi.textresources.user_config=classpath:/text_resources/test_user.pb.txt
jingyi.textresources.common_config=
jingyi.textresources.freq_config=

# patient module
patient.sync.enabled=true
patient.sync.start_delay_minutes=10000
patient.sync.interval_minutes=10000

# 医院配置
hospital_pb_txt=
