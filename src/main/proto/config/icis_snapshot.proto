syntax = "proto3";

import "config/icis_nursing_record.proto";
import "config/icis_nursing_score.proto";

package com.jingyicare.jingyi_icis_engine.proto.config;

message PatientSnapshotPB {
    int64 pid = 1;

    string statistics_date = 2;  // 统计日期，格式 yyyy-MM-dd，不含时间和时区
    string monitoring_start_iso8601 = 3;  // StatisticsDayWindow.monitoringStartUtc
    string monitoring_end_iso8601 = 4;    // StatisticsDayWindow.monitoringEndUtc
    string balance_start_iso8601 = 5;     // StatisticsDayWindow.balanceStartUtc
    string balance_end_iso8601 = 6;       // StatisticsDayWindow.balanceEndUtc

    // 护理评分记录
    repeated ScoreGroupPB score_groups = 7;
    string score_group_snapshot_at_iso8601 = 8;  // 快照时间，ISO 8601 格式

    // 护理记录
    repeated NursingRecordPB nursing_records = 9;
    string nursing_record_snapshot_at_iso8601 = 10;  // 快照时间，ISO 8601 格式
}
